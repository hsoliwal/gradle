name: M3 Gradle original Maven M3JDK database module boundary
on:
  push:
    branches: [master]
    paths:
      - 'm3/quality-bridge/**'
      - 'm3/MAVEN_GRADLE_CONVERGENCE.md'
      - '.github/workflows/m3-gradle-m3jdk-db-module-access.yml'
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - 'm3/MAVEN_GRADLE_CONVERGENCE.md'
      - '.github/workflows/m3-gradle-m3jdk-db-module-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-owned-m3jdk-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify closed JVM argument contract and evidence pin
        run: |
          sh m3/quality-bridge/scripts/verify-m3jdk-db-module-access.sh
          sh m3/quality-bridge/scripts/verify-m3jdk-db-module-workflow.sh
      - name: Checkout merged Maven #220 original database owner
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: c19789716fab23db8b46180f9fd8982bdff298d0
          path: m3-maven-m3jdk-db
          persist-credentials: false
      - name: Verify original Maven platform binding and build original polyglot JAR
        run: |
          mvn -B -ntp -f m3-maven-m3jdk-db/tools/m3-polyglot-maven-plugin/pom.xml verify
          test -s m3-maven-m3jdk-db/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Refuse missing M3JDK database on real Gradle TestKit
        run: |
          export M3_POLYGLOT_M3JDK_DB_JAR="$GITHUB_WORKSPACE/m3-maven-m3jdk-db/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3JdkDbModuleAccessRealEngineTest' --rerun-tasks
