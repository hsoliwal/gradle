name: M3 Gradle original Maven #200 installed LLVM compiler selection
on:
  push:
    branches: [master]
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-maven200-llvm-selection.yml'
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-maven200-llvm-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-maven200-llvm-installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Guard exact source, recipe and original Gradle acceptance
        run: sh m3/quality-bridge/scripts/verify-maven200-llvm-workflow.sh
      - name: Checkout merged Maven #200 original LLVM compiler provider
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 0249d0fd050ac89c89f7a0f8af1328cb944f076c
          path: m3-maven-llvm200
          persist-credentials: false
      - name: Verify original Maven #200 compiler selection and native conformance
        run: |
          command -v clang
          command -v clang++
          mvn -B -ntp -f m3-maven-llvm200/tools/m3-polyglot-maven-plugin/pom.xml verify
          test -s m3-maven-llvm200/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Prove original home/digest and Objective-C++ aliases via real Gradle TestKit
        shell: bash
        run: |
          set -euo pipefail
          LLVM_BIN_DIR="$(dirname "$(command -v clang)")"
          export M3_LLVM200_HOME="$(dirname "$LLVM_BIN_DIR")"
          test -x "$M3_LLVM200_HOME/bin/clang"
          test -x "$M3_LLVM200_HOME/bin/clang++"
          export M3_LLVM200_CLANG_SHA256="$(sha256sum "$(realpath "$M3_LLVM200_HOME/bin/clang")" | cut -d' ' -f1)"
          export M3_POLYGLOT_LLVM200_JAR="$GITHUB_WORKSPACE/m3-maven-llvm200/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          export M3_MAVEN_LLVM200_FIXTURES="$GITHUB_WORKSPACE/m3-maven-llvm200/tools/m3-polyglot-maven-plugin/examples/llvm"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3Llvm200InstallationRealEngineTest' --rerun-tasks
