name: M3 Gradle analyzer bridge
on:
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-quality-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-gradle-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify Java 17 portable backend argv contract without Gradle dependencies
        run: sh m3/quality-bridge/scripts/verify-portable-backends.sh
      - name: Verify original Maven JDK21 fingerprint argv contract without Gradle dependencies
        run: sh m3/quality-bridge/scripts/verify-machine-fingerprint-args.sh
      - name: Verify canonical Maven IDE-delta v1 bytes using Java 17
        run: sh m3/quality-bridge/scripts/verify-ide-delta.sh
      - name: Test standalone bridge, canonical reports and Gradle TestKit
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test
      - name: Validate lazy task registration under configuration cache
        run: |
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge tasks --all --configuration-cache

      - name: Check out exact Maven converter source version for cross-build proof
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 89de67b38249ea914ef252b765e59d2002780e1b
          path: m3-maven-adapter
          persist-credentials: false
      - name: Build original Maven converter with its real shaded JSON parser
        run: |
          mvn -B -ntp -f m3-maven-adapter/tools/m3-analyzer-report-adapter/pom.xml verify
          test -s m3-maven-adapter/tools/m3-analyzer-report-adapter/target/m3-analyzer-report-adapter-0.1.0-SNAPSHOT.jar
      - name: Exercise the actual Maven JAR through Gradle TestKit (Semgrep)
        run: |
          export M3_ADAPTER_JAR="$GITHUB_WORKSPACE/m3-maven-adapter/tools/m3-analyzer-report-adapter/target/m3-analyzer-report-adapter-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3NormalizeAnalyzerXmlTaskTest' --rerun-tasks

      # Source custody for Maven #143 + #147: pin the reviewed merged
      # portable-state contract, not Maven's moving master or a binary download.
      - name: Check out merged Maven portable module-state engine source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 4d4976f9cf6f62b5f007cf5ab80ee92c67c0f3f7
          path: m3-maven-polyglot
          persist-credentials: false
      - name: Verify original Maven polyglot engine, module DB and portable backend contracts
        run: |
          mvn -B -ntp -f m3-maven-polyglot/tools/m3-polyglot-maven-plugin/pom.xml verify
          test -s m3-maven-polyglot/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Verify real Maven state reuse and missing-backend refusal through Gradle TestKit
        run: |
          export M3_POLYGLOT_JAR="$GITHUB_WORKSPACE/m3-maven-polyglot/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3PolyglotRealEngineTest' --rerun-tasks

      # Exact same Maven review commit also contains merged #148. Only JDK21
      # can execute its original compiler/JavacTask-based AST producer.
      - name: Verify Maven #148 original JDK21 smart-builder producer
        if: matrix.java == '21'
        run: |
          mvn -B -ntp -f m3-maven-polyglot/tools/m3-smart-builder/pom.xml verify
          test -s m3-maven-polyglot/tools/m3-smart-builder/target/m3-smart-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Verify original Maven AST receipt refusal through Gradle TestKit
        if: matrix.java == '21'
        run: |
          export M3_SMART_BUILDER_JAR="$GITHUB_WORKSPACE/m3-maven-polyglot/tools/m3-smart-builder/target/m3-smart-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3MachineFingerprintRealEngineTest' --rerun-tasks
