name: M3 Gradle analyzer bridge
on:
  push:
    branches: [master]
    paths:
      - 'm3/quality-bridge/**'
      - 'm3/MAVEN_GRADLE_CONVERGENCE.md'
      - '.github/workflows/m3-gradle-quality-bridge.yml'
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - 'm3/MAVEN_GRADLE_CONVERGENCE.md'
      - '.github/workflows/m3-gradle-quality-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-gradle-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Guard M3 cross-fork qualification lanes against lost merges
        run: sh m3/quality-bridge/scripts/verify-quality-workflow.sh
      - name: Verify Java 17 portable backend argv contract without Gradle dependencies
        run: sh m3/quality-bridge/scripts/verify-portable-backends.sh
      - name: Verify original Maven JDK21 fingerprint argv contract without Gradle dependencies
        run: sh m3/quality-bridge/scripts/verify-machine-fingerprint-args.sh
      - name: Verify Maven ECJ and javac original diagnostic adapter argv
        run: sh m3/quality-bridge/scripts/verify-compiler-diagnostics-args.sh
      - name: Verify canonical Maven IDE-delta v1 bytes using Java 17
        run: sh m3/quality-bridge/scripts/verify-ide-delta.sh
      - name: Verify Maven #149 local-cache Java 17 argv contract
        run: sh m3/quality-bridge/scripts/verify-polyglot-cache-args.sh
      - name: Qualify Maven #184 project DB CLI command contract
        run: sh m3/quality-bridge/scripts/verify-project-db-args.sh
      - name: Qualify Maven #203 LLVM/MLIR/LLD inventory schema without Gradle dependencies
        run: sh m3/quality-bridge/scripts/verify-llvm-tools-inventory.sh
      - name: Test standalone bridge, canonical reports and Gradle TestKit
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test
      - name: Validate lazy task registration under configuration cache
        run: |
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge tasks --all --configuration-cache

      # Maven #160 introduced ECJ/javac normalization. #178 fixes false
      # COMPLETE for unreadable/non-English javac output; do not pin #160 alone.
      - name: Check out corrected Maven #178 converter source for cross-build proof
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 26efa14266288f8cb11c6232bbdc8ea94ae26134
          path: m3-maven-adapter
          persist-credentials: false
      - name: Build original Maven converter with its real shaded JSON parser
        run: |
          mvn -B -ntp -f m3-maven-adapter/tools/m3-analyzer-report-adapter/pom.xml verify
          test -s m3-maven-adapter/tools/m3-analyzer-report-adapter/target/m3-analyzer-report-adapter-0.1.0-SNAPSHOT.jar
      - name: Exercise the actual Maven JAR through Gradle TestKit (Semgrep)
        run: |
          export M3_ADAPTER_JAR="$GITHUB_WORKSPACE/m3-maven-adapter/tools/m3-analyzer-report-adapter/target/m3-analyzer-report-adapter-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3NormalizeAnalyzerXmlTaskTest' --rerun-tasks
      - name: Exercise actual Maven ECJ and javac diagnostics through Gradle TestKit
        run: |
          export M3_ADAPTER_JAR="$GITHUB_WORKSPACE/m3-maven-adapter/tools/m3-analyzer-report-adapter/target/m3-analyzer-report-adapter-0.1.0-SNAPSHOT.jar"
          export M3_ADAPTER_COMPILER_FIXTURES="$GITHUB_WORKSPACE/m3-maven-adapter/tools/m3-analyzer-report-adapter/src/test/resources/compiler"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3CompilerDiagnosticsRealEngineTest' --rerun-tasks

      # Source custody: Maven #143/#147/#148 plus #155 QDox/lint build repair
      # and #149 polyglot cache; pin the merged source rather than moving master.
      - name: Check out merged Maven portable module-state engine source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: b47e9a1e9173502c19de9bb6657a4f88b3267487
          path: m3-maven-polyglot
          persist-credentials: false
      - name: Verify original Maven polyglot engine, module DB and portable backend contracts
        run: |
          mvn -B -ntp -f m3-maven-polyglot/tools/m3-polyglot-maven-plugin/pom.xml verify
          test -s m3-maven-polyglot/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Verify real Maven state reuse and missing-backend refusal through Gradle TestKit
        run: |
          export M3_POLYGLOT_JAR="$GITHUB_WORKSPACE/m3-maven-polyglot/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3PolyglotRealEngineTest' --rerun-tasks

      # Maven #149 is not qualified by argv alone: verify actual cache
      # restoration using the same source-pinned JAR in distinct Gradle checkouts.
      - name: Verify Maven #149 cache reuse across Gradle TestKit checkouts
        run: |
          export M3_POLYGLOT_JAR="$GITHUB_WORKSPACE/m3-maven-polyglot/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3PolyglotCacheRealEngineTest' --rerun-tasks

      # Maven #184 unifies M3IndexDB storage and admits embedded/legacy and
      # native/m3db aliases. Use a newer pinned engine separately from #149.
      - name: Check out merged Maven M3IndexDB reconciliation source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: f92096f8d3eb135d28cf698335a4423ef9179e9d
          path: m3-maven-state-aliases
          persist-credentials: false
      - name: Verify Maven original #184 backend contract and module DB
        run: |
          mvn -B -ntp -f m3-maven-state-aliases/tools/m3-polyglot-maven-plugin/pom.xml verify
          test -s m3-maven-state-aliases/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Verify Maven embedded/native aliases by real Gradle TestKit executions
        run: |
          export M3_POLYGLOT_STATE_ALIAS_JAR="$GITHUB_WORKSPACE/m3-maven-state-aliases/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3PolyglotStateAliasesRealEngineTest' --rerun-tasks

      # Exact same Maven review commit also contains merged #148. Only JDK21
      # can execute its original compiler/JavacTask-based AST producer.
      - name: Verify Maven #148 original JDK21 smart-builder producer
        if: matrix.java == '21'
        run: |
          mvn -B -ntp -f m3-maven-polyglot/tools/m3-smart-builder/pom.xml verify
          test -s m3-maven-polyglot/tools/m3-smart-builder/target/m3-smart-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Verify original Maven AST receipt refusal through Gradle TestKit
        if: matrix.java == '21'
        run: |
          export M3_SMART_BUILDER_JAR="$GITHUB_WORKSPACE/m3-maven-polyglot/tools/m3-smart-builder/target/m3-smart-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3MachineFingerprintRealEngineTest' --rerun-tasks

  m3-project-db-crossfork:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Maven #190 introduces native Gradle JUnit source discovery.
      # Maven #194 repairs TaskRunner's dry-run commitStaged null-store crash,
      # observed on both JDK 17 and 21. Pin their merged superset, never master.
      - name: Check out exact merged Maven project database source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 64e5ce257c46207eac32407f00979cfc4a79767e
          path: m3-maven-project-db
          persist-credentials: false
      - name: Qualify and install original Maven M3IndexDB storage owner
        run: |
          mvn -B -ntp -f m3-maven-project-db/tools/m3-polyglot-maven-plugin/pom.xml install
          test -s m3-maven-project-db/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Qualify original project DB ingestion, retrieval and CLI
        run: |
          mvn -B -ntp -f m3-maven-project-db/tools/project-db/pom.xml verify
          test -s m3-maven-project-db/tools/project-db/target/maven-project-db-plugin-0.1.0-SNAPSHOT.jar
      - name: Cross-verify Gradle task against original Maven project DB engine
        run: |
          export M3_POLYGLOT_JAR="$GITHUB_WORKSPACE/m3-maven-project-db/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          export M3_PROJECT_DB_JAR="$GITHUB_WORKSPACE/m3-maven-project-db/tools/project-db/target/maven-project-db-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3ProjectDbRealEngineTest' --rerun-tasks
      - name: Verify native Gradle-only JUnit evidence reaches Maven M3IndexDB
        run: |
          export M3_POLYGLOT_JAR="$GITHUB_WORKSPACE/m3-maven-project-db/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          export M3_PROJECT_DB_JAR="$GITHUB_WORKSPACE/m3-maven-project-db/tools/project-db/target/maven-project-db-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3ProjectDbGradleNativeRealEngineTest' --rerun-tasks

  m3-llvm-crossfork:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Maven #198 contributes the LLVM drivers to the original provider SPI.
      # Pin merged source; the installed host Clang is independently hashed.
      - name: Check out merged Maven original LLVM provider source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 83284eb8de8758fa9ffa84ca6c2d764e67c183c8
          path: m3-maven-llvm-provider
          persist-credentials: false
      - name: Qualify original Maven LLVM compiler provider and SPI tests
        run: |
          mvn -B -ntp -f m3-maven-llvm-provider/tools/m3-polyglot-maven-plugin/pom.xml verify
          test -s m3-maven-llvm-provider/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Verify LLVM provider discovery, no-tool planning and real host Clang from Gradle
        run: |
          export M3_POLYGLOT_LLVM_JAR="$GITHUB_WORKSPACE/m3-maven-llvm-provider/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          export M3_MAVEN_LLVM_FIXTURES="$GITHUB_WORKSPACE/m3-maven-llvm-provider/tools/m3-polyglot-maven-plugin/examples/llvm-native"
          export M3_LLVM_CLANG="$(command -v clang)"
          test -x "$M3_LLVM_CLANG"
          export M3_LLVM_CLANG_SHA256="$(sha256sum "$M3_LLVM_CLANG" | cut -d ' ' -f1)"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3LlvmProviderRealEngineTest' --rerun-tasks

  m3-maven206-portable-crossfork:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Pin Maven #206's optional DB providers independently of LLVM #203.
      # Later #209 native builder changes and real-driver execution require
      # a separate exact-source qualification boundary.
      - name: Check out exact merged Maven #206 portable DB providers
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: fee3ca7cd8ca0b698d7308103836e99074479950
          path: m3-maven-206
          persist-credentials: false
      - name: Qualify and install the original Maven #206 polyglot engine
        run: |
          mvn -B -ntp -f m3-maven-206/tools/m3-polyglot-maven-plugin/pom.xml install
          test -s m3-maven-206/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Test original Maven #206 missing-optional-driver refusals through Gradle
        run: |
          export M3_PORTABLE_ENGINES_JAR="$GITHUB_WORKSPACE/m3-maven-206/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3PortableEnginesRealEngineTest' --rerun-tasks

  m3-llvm-pipeline-crossfork:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Maven #203 first added LINKER, OPTIMIZER, ASSEMBLER to the v1 SPI and
      # packaged their original LLVM dispatch in a separately installed JAR.
      # Keep this lane independent of Maven #198 and the Gradle #44 Clang lane.
      - name: Check out the exact merged Maven #203 LLVM tools provider source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 3441dc1e91a2835b7b6bca608ffb9676565d9eff
          path: m3-maven-llvm-tools
          persist-credentials: false
      - name: Qualify and install the original Maven polyglot ServiceLoader SPI
        run: |
          mvn -B -ntp -f m3-maven-llvm-tools/tools/m3-polyglot-maven-plugin/pom.xml install
          test -s m3-maven-llvm-tools/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Qualify Maven's separate original LLVM/MLIR/LLD provider artifact
        run: |
          mvn -B -ntp -f m3-maven-llvm-tools/tools/m3-llvm-tools-provider/pom.xml verify
          test -s m3-maven-llvm-tools/tools/m3-llvm-tools-provider/target/m3-llvm-tools-provider-0.1.0-SNAPSHOT.jar
          sh m3-maven-llvm-tools/tools/m3-llvm-tools-provider/scripts/verify.sh
      - name: Verify real SPI inventory, no-tool pipeline planning, and SHA refusal from Gradle
        run: |
          export M3_MAVEN_LLVM_PIPELINE_ENGINE_JAR="$GITHUB_WORKSPACE/m3-maven-llvm-tools/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          export M3_MAVEN_LLVM_PIPELINE_PROVIDER_JAR="$GITHUB_WORKSPACE/m3-maven-llvm-tools/tools/m3-llvm-tools-provider/target/m3-llvm-tools-provider-0.1.0-SNAPSHOT.jar"
          export M3_MAVEN_LLVM_PIPELINE_FIXTURES="$GITHUB_WORKSPACE/m3-maven-llvm-tools/tools/m3-llvm-tools-provider/example/llvm-ir"
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test --tests '*M3LlvmToolsProviderRealEngineTest' --rerun-tasks
