name: M3 Gradle analyzer bridge
on:
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-quality-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-gradle-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Test standalone bridge, canonical reports and Gradle TestKit
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test
      - name: Validate lazy task registration under configuration cache
        run: |
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge tasks --all --configuration-cache
