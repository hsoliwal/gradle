name: M3 Gradle original Maven 236 optional Apache Derby backend
on:
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-maven236-derby.yml'
  push:
    branches: [master]
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-maven236-derby.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-maven236-derby:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Prove existing Gradle Java17 argv admission and source-pin guard
        shell: bash
        run: |
          set -euo pipefail
          sh m3/quality-bridge/scripts/verify-maven236-derby-workflow.sh
          sh m3/quality-bridge/scripts/verify-portable-backends.sh
      - name: Checkout exact merged Maven 236 with optional Java17 Derby owner
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 2bc1468e9f318724b01ae4d51b3078aa2a09a6d3
          path: m3-maven-236
          persist-credentials: false
      - name: Build and execute real original Maven 235/236 Derby transactions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C m3-maven-236 rev-parse HEAD)" = '2bc1468e9f318724b01ae4d51b3078aa2a09a6d3'
          mvn -B -ntp -f m3-maven-236/tools/m3-polyglot-maven-plugin/pom.xml install
          mvn -B -ntp -f m3-maven-236/tools/m3-polyglot-maven-plugin/pom.xml -Pm3-derby verify 2>&1 | tee m3-derby-owner.log
          grep -F 'actual Derby JDBC transaction/restart/recovery assertions' m3-derby-owner.log
          test -s m3-maven-236/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          jar tf m3-maven-236/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar |
            grep -Fx 'io/synexia/maven/polyglot/M3DerbyBackendProvider.class'
      - name: Resolve original test-scoped Derby 10.16.1.1 dependency closure without vendoring
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3-maven-236/tools/m3-polyglot-maven-plugin/pom.xml -Pm3-derby \
            org.apache.maven.plugins:maven-dependency-plugin:3.7.1:copy-dependencies \
            -DincludeGroupIds=org.apache.derby -DincludeScope=test \
            -DoutputDirectory="$GITHUB_WORKSPACE/m3-derby-runtime"
          test -s m3-derby-runtime/derby-10.16.1.1.jar
          test -s m3-derby-runtime/derbytools-10.16.1.1.jar
          find m3-derby-runtime -maxdepth 1 -type f -name '*.jar' -print0 | xargs -0 sha256sum
      - name: Execute pinned Maven engine with separately SHA-verified Derby JARs through Gradle
        shell: bash
        env:
          M3_REQUIRE_DERBY_REAL_ENGINE: '1'
          JAVA_TOOL_OPTIONS: '-Dderby.stream.error.field=java.lang.System.err'
        run: |
          set -euo pipefail
          export M3_MAVEN_DERBY_ENGINE_JAR="$GITHUB_WORKSPACE/m3-maven-236/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          export M3_DERBY_DRIVER_DIRECTORY="$GITHUB_WORKSPACE/m3-derby-runtime"
          sha256sum "$M3_MAVEN_DERBY_ENGINE_JAR"
          ./gradlew --no-daemon --stacktrace --console=plain \
            -p m3/quality-bridge test \
            --tests 'io.synexia.gradle.quality.M3DerbyRealEngineTest' --rerun-tasks
      - name: Require four real non-skipped Maven Derby TestKit cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          path = Path('m3/quality-bridge/build/test-results/test/TEST-io.synexia.gradle.quality.M3DerbyRealEngineTest.xml')
          assert path.is_file() and not path.is_symlink() and path.stat().st_size <= 1024 * 1024
          contents = path.read_bytes()
          assert b'<!DOCTYPE' not in contents and b'<!ENTITY' not in contents
          suite = ET.fromstring(contents)
          name = 'io.synexia.gradle.quality.M3DerbyRealEngineTest'
          assert suite.tag == 'testsuite' and suite.attrib.get('name') == name
          assert all(suite.attrib.get(k) == v for k,v in [('tests','4'),('skipped','0'),('errors','0'),('failures','0')])
          cases = [child for child in suite if child.tag == 'testcase']
          expected = {
            'missingDerbyDriverRefusesBeforeExecutingToolOrFallingBack()',
            'originalDerbyDriverReopensAndVerifiesSealedStateAcrossGradleInvocations()',
            'wrongDriverShaIsRejectedByGradleBeforeStartingMaven()',
            'symlinkedDerbyDatabaseDirectoryFailsClosedWithoutToolExecution()',
          }
          assert len(cases) == 4 and {c.attrib.get('name') for c in cases} == expected
          assert all(c.attrib.get('classname') == name and not list(c) for c in cases)
          print('PASS: four executed original-Maven Derby Gradle cases, zero skips')
          PY
      - name: Retain Derby TestKit and original Maven evidence on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-gradle-maven236-derby-jdk-${{ matrix.java }}
          path: |
            m3-derby-owner.log
            m3/quality-bridge/build/test-results/test/**
            m3/quality-bridge/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14
