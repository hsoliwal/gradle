name: M3 Gradle current nine-case project DB source-owned Maven 246
on:
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-maven246-projectdb-nine.yml'
  push:
    branches: [master]
    paths:
      - 'm3/quality-bridge/**'
      - '.github/workflows/m3-gradle-maven246-projectdb-nine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-nine-source-owned:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Guard source owner and four exact Gradle TestKit class selectors
        run: sh m3/quality-bridge/scripts/verify-maven246-projectdb-nine.sh
      - name: Checkout original Maven 246 secure JUnit and project DB owner
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 5942487fbfa7ad7fbc7313cecf12958f823b6262
          path: m3-maven-246
          persist-credentials: false
      - name: Verify immutable original Maven source and Java17 JUnit refusal oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C m3-maven-246 rev-parse HEAD)" = '5942487fbfa7ad7fbc7313cecf12958f823b6262'
          test "$(git -C m3-maven-246 hash-object tools/project-db/scripts/M3GradleTestKitReceiptMain.java)" = 6fd1f257081b433b98b29eea3b5651bf2449d02b
          test "$(git -C m3-maven-246 hash-object tools/project-db/scripts/verify-gradle-testkit-results.sh)" = d0c2f28b409f374c9f26343cbe17d8be7ac200a8
          test "$(git -C m3-maven-246 hash-object tools/project-db/scripts/verify-gradle-junit-modes.sh)" = 2b85e9c1f4e43cfff6518d4be7a13212cb107c43
          sh m3-maven-246/tools/project-db/scripts/verify-gradle-junit-modes.sh
      - name: Build and verify original source-owned M3IndexDB and project DB engines
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3-maven-246/tools/m3-polyglot-maven-plugin/pom.xml install
          mvn -B -ntp -f m3-maven-246/tools/project-db/pom.xml verify
          test -s m3-maven-246/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar
          test -s m3-maven-246/tools/project-db/target/maven-project-db-plugin-0.1.0-SNAPSHOT.jar
      - name: Qualify current nine actual Gradle project DB TestKit cases in one invocation
        shell: bash
        run: |
          set -euo pipefail
          export M3_POLYGLOT_JAR="$GITHUB_WORKSPACE/m3-maven-246/tools/m3-polyglot-maven-plugin/target/m3-polyglot-maven-plugin-0.1.0-SNAPSHOT.jar"
          export M3_PROJECT_DB_JAR="$GITHUB_WORKSPACE/m3-maven-246/tools/project-db/target/maven-project-db-plugin-0.1.0-SNAPSHOT.jar"
          export M3_PRUNED_POLYGLOT_JAR="$M3_POLYGLOT_JAR"
          export M3_PRUNED_PROJECT_DB_JAR="$M3_PROJECT_DB_JAR"
          sha256sum "$M3_POLYGLOT_JAR" "$M3_PROJECT_DB_JAR"
          ./gradlew --no-daemon --stacktrace --console=plain \
            -p m3/quality-bridge test \
            --tests 'io.synexia.gradle.quality.M3ProjectDbRealEngineTest' \
            --tests 'io.synexia.gradle.quality.M3ProjectDbGradleNativeRealEngineTest' \
            --tests 'io.synexia.gradle.quality.M3ProjectDbTaskTest' \
            --tests 'io.synexia.gradle.quality.M3ProjectDbPrunedSymlinkRealEngineTest' --rerun-tasks
      - name: Admit only original Maven 246 secure nine-case Java17 receipt
        shell: bash
        run: |
          set -euo pipefail
          sh m3-maven-246/tools/project-db/scripts/verify-gradle-testkit-results.sh \
            m3/quality-bridge/build/test-results/test current-nine
      - name: Retain original nine-case Gradle JUnit/HTML receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-gradle-maven246-nine-jdk-${{ matrix.java }}
          path: |
            m3/quality-bridge/build/test-results/test/**
            m3/quality-bridge/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14
