# SPDX-License-Identifier: Apache-2.0
name: M3 Gradle candidate Maven advice revalidation
on:
  pull_request:
    paths:
      - 'm3/quality-bridge/**'
      - 'm3/MAVEN_GRADLE_CONVERGENCE.md'
      - '.github/workflows/m3-gradle-smart-advice-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-source-bound-advice:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Guard exact Maven candidate source and five non-skipped TestKit methods
        run: sh m3/quality-bridge/scripts/verify-smart-advice-candidate-workflow.sh
      - name: Verify sealed Gradle candidate source manifest
        run: sha256sum -c m3/quality-bridge/receipts/M3-SMART-ADVICE-CANDIDATE-20261126.sha256
      # #317 is merged into #315's feature branch, NOT into Maven master.
      # This source pin is a candidate qualification lane and never replaces
      # the production Maven source pin in m3-gradle-quality-bridge.yml.
      - name: Checkout exact Maven #315 candidate including merged child #317
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 7106d65cdce5856f2fbd84f0b72981b47dc8c709
          path: m3-maven-smart-candidate
          persist-credentials: false
      - name: Qualify the original candidate Maven smart-builder and verify source identity
        run: |
          test "$(git -C m3-maven-smart-candidate rev-parse HEAD)" = 7106d65cdce5856f2fbd84f0b72981b47dc8c709
          mvn -B -ntp -f m3-maven-smart-candidate/tools/m3-smart-builder/pom.xml verify
          test -s m3-maven-smart-candidate/tools/m3-smart-builder/target/m3-smart-maven-plugin-0.1.0-SNAPSHOT.jar
      - name: Build Maven's original modular MCP fixture (no model inference)
        run: |
          mkdir -p m3-maven-smart-candidate/tools/m3-smart-builder/target/mcp-fixture
          javac --release 17 -encoding UTF-8 -Xlint:all -Werror \
            -d m3-maven-smart-candidate/tools/m3-smart-builder/target/mcp-fixture \
            m3-maven-smart-candidate/tools/m3-smart-builder/src/test/fixture/module-info.java \
            m3-maven-smart-candidate/tools/m3-smart-builder/src/test/fixture/io/synexia/chromellm/standalone/StandaloneMain.java
          jar --create --file m3-maven-smart-candidate/tools/m3-smart-builder/target/mcp-fixture.jar \
            -C m3-maven-smart-candidate/tools/m3-smart-builder/target/mcp-fixture .
          test -s m3-maven-smart-candidate/tools/m3-smart-builder/target/mcp-fixture.jar
      - name: Run exact Gradle candidate summary and provider revalidation tests
        env:
          M3_SMART_BUILDER_JAR: ${{ github.workspace }}/m3-maven-smart-candidate/tools/m3-smart-builder/target/m3-smart-maven-plugin-0.1.0-SNAPSHOT.jar
          M3_SMART_REVALIDATION_CANDIDATE_JAR: ${{ github.workspace }}/m3-maven-smart-candidate/tools/m3-smart-builder/target/m3-smart-maven-plugin-0.1.0-SNAPSHOT.jar
          M3_SMART_REVALIDATION_FIXTURE_JAR: ${{ github.workspace }}/m3-maven-smart-candidate/tools/m3-smart-builder/target/mcp-fixture.jar
        run: |
          ./gradlew --no-daemon --stacktrace \
            -p m3/quality-bridge test \
            --tests '*M3SmartReviewRealEngineTest.candidateRefusesInvalidPreparationBeforeLaunchingSummarizer' \
            --tests '*M3SmartReviewRealEngineTest.candidateRejectsSameSizeTimestampRestoredSourceDriftAfterSummary' \
            --tests '*M3SmartReviewRealEngineTest.candidateAcceptsUnchangedPreparationAfterSummary' \
            --tests '*M3SmartReviewRealEngineTest.candidateRevokesAdvisoryWhenOriginalProviderMutatesSourceAfterInference' \
            --tests '*M3SmartReviewRealEngineTest.candidateRetainsSyntheticAdvisoryOnlyWithUnchangedReceipts' \
            --rerun-tasks
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('m3/quality-bridge/build/test-results/test/TEST-io.synexia.gradle.quality.M3SmartReviewRealEngineTest.xml')
          cases = list(ET.parse(report).getroot().iter('testcase'))
          expected = {
              'candidateRefusesInvalidPreparationBeforeLaunchingSummarizer',
              'candidateRejectsSameSizeTimestampRestoredSourceDriftAfterSummary',
              'candidateAcceptsUnchangedPreparationAfterSummary',
              'candidateRevokesAdvisoryWhenOriginalProviderMutatesSourceAfterInference',
              'candidateRetainsSyntheticAdvisoryOnlyWithUnchangedReceipts',
          }
          found = {node.attrib.get('name', '').removesuffix('()') for node in cases}
          assert found == expected, (found, expected)
          for node in cases:
              assert not any(node.find(tag) is not None for tag in ('skipped', 'failure', 'error')), node.attrib
          print('PASS: all five exact original-Maven candidate TestKit cases executed; no skips')
          PY
      - name: Upload candidate TestKit XML reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-candidate-advice-jdk-${{ matrix.java }}
          path: m3/quality-bridge/build/test-results/test/
          if-no-files-found: warn
