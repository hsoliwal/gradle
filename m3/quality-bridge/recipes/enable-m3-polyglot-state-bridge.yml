# Recipe-first opt-in consumer registration. State backend, Maven binary
# source pin and Gradle task execution remain deliberate consumer decisions.
---
type: specs.openrewrite.org/v1beta/recipe
name: io.synexia.gradle.recipe.EnableM3PolyglotStateBridge
displayName: Enable the opt-in M3 polyglot state bridge
description: >-
  Apply the separately installed M3 quality plugin to a chosen Gradle build.
  The operator may then configure m3PolyglotRun with the source-pinned Maven
  #227+ embedded, native or explicitly supplied HSQLDB state backend. No task
  runs simply by applying it,
  and existing Gradle caches and task dependencies are left intact.
recipeList:
  - org.openrewrite.gradle.plugins.AddPlugin:
      pluginId: io.synexia.m3.quality
      version: '0.1.0-SNAPSHOT'
